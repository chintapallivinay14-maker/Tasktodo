{% extends "base.html" %}
{% block title %}Login · TaskFlow{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="brand auth-brand">✓ TaskFlow</div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your tasks.</p>
    <form method="post" class="form-stack">
        <label>Username or Email
            <input name="identity" required autocomplete="username">
        </label>
        <label>Password
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
