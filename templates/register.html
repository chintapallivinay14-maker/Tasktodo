{% extends "base.html" %}
{% block title %}Register · TaskFlow{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="brand auth-brand">✓ TaskFlow</div>
    <h1>Create your account</h1>
    <p class="muted">Start organizing your work today.</p>
    <form method="post" class="form-stack">
        <label>Username
            <input name="username" minlength="3" maxlength="80" required autocomplete="username">
        </label>
        <label>Email
            <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Password
            <input type="password" name="password" minlength="8" required autocomplete="new-password">
        </label>
        <label>Confirm Password
            <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
        </label>
        <button class="btn primary full" type="submit">Create Account</button>
    </form>
    <p class="auth-link">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
